<svg width="1280" height="200" viewBox="0 0 1280 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Focus Cards - Achraf Ayaou">
  <defs>
    <!-- Card gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BC8CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D2A8FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7B72" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFA657" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Glass effect -->
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#010409" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Card 1: Clean Code -->
  <g transform="translate(30, 20)" filter="url(#glassShadow)">
    <rect width="380" height="160" rx="16" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
    <!-- Top accent line -->
    <rect x="0" y="0" width="380" height="3" rx="1.5" fill="url(#blueGrad)"/>
    
    <!-- Icon container -->
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="46" y="52" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="20" fill="#58A6FF">&lt;/&gt;</text>
    
    <!-- Text -->
    <text x="24" y="100" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#f0f6fc">Clean Code</text>
    <text x="24" y="123" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="13.5" fill="#8b949e">Readable, scalable &amp; maintainable</text>
    <text x="24" y="142" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="13.5" fill="#8b949e">solutions that last.</text>
  </g>

  <!-- Card 2: Intuitive UX -->
  <g transform="translate(450, 20)" filter="url(#glassShadow)">
    <rect width="380" height="160" rx="16" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
    <rect x="0" y="0" width="380" height="3" rx="1.5" fill="url(#purpleGrad)"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <!-- Palette icon using text -->
    <text x="46" y="53" text-anchor="middle" font-size="22">🎨</text>
    
    <text x="24" y="100" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#f0f6fc">Intuitive UX</text>
    <text x="24" y="123" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="13.5" fill="#8b949e">Human-centered designs that</text>
    <text x="24" y="142" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="13.5" fill="#8b949e">feel natural &amp; delightful.</text>
  </g>

  <!-- Card 3: Education for All -->
  <g transform="translate(870, 20)" filter="url(#glassShadow)">
    <rect width="380" height="160" rx="16" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>
    <rect x="0" y="0" width="380" height="3" rx="1.5" fill="url(#orangeGrad)"/>
    
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="46" y="53" text-anchor="middle" font-size="22">📚</text>
    
    <text x="24" y="100" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#f0f6fc">Education for All</text>
    <text x="24" y="123" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="13.5" fill="#8b949e">Open knowledge &amp; EdTech tools</text>
    <text x="24" y="142" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="13.5" fill="#8b949e">that empower learners.</text>
  </g>
</svg>
