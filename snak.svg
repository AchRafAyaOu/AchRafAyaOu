<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Achraf Ayaou Banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1278" height="398" rx="15" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Window dots (macOS style) -->
  <circle cx="40" cy="35" r="7" fill="#FF5F56"/>
  <circle cx="64" cy="35" r="7" fill="#FFBD2E"/>
  <circle cx="88" cy="35" r="7" fill="#27C93F"/>

  <!-- File name -->
  <text x="120" y="40" font-family="'Fira Code', monospace" font-size="14" fill="#8b949e">~/AchRafAyaOu/README.md</text>

  <!-- Left content -->
  <g transform="translate(60, 90)">
    <!-- Code bracket decoration -->
    <text x="0" y="0" font-family="'Fira Code', monospace" font-size="20" fill="#30363d">&lt;/&gt;</text>
    
    <text x="0" y="50" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="54" fill="url(#textGrad)">Achraf Ayaou</text>
    <text x="0" y="95" font-family="'Fira Code', monospace" font-weight="500" font-size="22" fill="#f0f6fc">Web Developer • AI Enthusiast</text>
    <text x="0" y="125" font-family="'Fira Code', monospace" font-weight="400" font-size="16" fill="#8b949e">UI/UX &amp; Digital Experiences Builder</text>
    
    <!-- Tech badges -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="68" height="26" rx="13" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
      <text x="34" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#58A6FF">React</text>
      
      <rect x="78" y="0" width="68" height="26" rx="13" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
      <text x="112" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#F7DF1E">JavaScript</text>
      
      <rect x="156" y="0" width="72" height="26" rx="13" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
      <text x="192" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#3776AB">Python</text>
      
      <rect x="238" y="0" width="52" height="26" rx="13" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
      <text x="264" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#FF5722">AI</text>
    </g>
  </g>

  <!-- Right side - Code window illustration -->
  <g transform="translate(750, 70)">
    <rect x="0" y="0" width="470" height="260" rx="12" fill="#010409" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="470" height="36" rx="12" fill="#161b22"/>
    <rect x="0" y="24" width="470" height="12" fill="#161b22"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F56" opacity="0.8"/>
    <circle cx="38" cy="18" r="5" fill="#FFBD2E" opacity="0.8"/>
    <circle cx="56" cy="18" r="5" fill="#27C93F" opacity="0.8"/>
    
    <!-- Code lines -->
    <g font-family="'Fira Code', monospace" font-size="13">
      <text x="20" y="65" fill="#8b949e"><tspan fill="#FF7B72">const</tspan> <tspan fill="#79C0FF">developer</tspan> <tspan fill="#FF7B72">=</tspan> {</text>
      <text x="40" y="88" fill="#8b949e">  name: <tspan fill="#A5D6FF">"Achraf Ayaou"</tspan>,</text>
      <text x="40" y="111" fill="#8b949e">  focus: [<tspan fill="#A5D6FF">"Web"</tspan>, <tspan fill="#A5D6FF">"AI"</tspan>, <tspan fill="#A5D6FF">"EdTech"</tspan>],</text>
      <text x="40" y="134" fill="#8b949e">  learning: <tspan fill="#A5D6FF">"Always"</tspan>,</text>
      <text x="40" y="157" fill="#8b949e">  motto: <tspan fill="#A5D6FF">"Build what matters"</tspan></text>
      <text x="20" y="180" fill="#8b949e">};</text>
      
      <text x="20" y="210" fill="#8b949e"><tspan fill="#BC8CFF">developer</tspan>.<tspan fill="#D2A8FF">code</tspan>() <tspan fill="#FF7B72">=&gt;</tspan> <tspan fill="#A5D6FF">"🚀"</tspan></text>
    </g>

    <!-- Cursor blink -->
    <rect x="220" y="198" width="8" height="16" fill="#58A6FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="397" width="1280" height="3" rx="1.5" fill="url(#textGrad)"/>
</svg>
